[project]
name = "as2csv"
version = "0.2.2"
description = "Account statement to CSV converter."
authors = [{ name = "Amotoma Halfeye", email = "amotomahalfeye@protonmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "typer>=0.26.3",
    "xlrd>=2.0.2",
]

[project.scripts]
as2csv = "as2csv.main:app"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
upgrade = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.hatch.build.targets.sdist]
only-packages = true
